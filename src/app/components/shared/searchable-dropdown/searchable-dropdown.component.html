<div class="dropdown-wrapper" [class.is-open]="isOpen" [class.has-error]="hasError" [class.is-disabled]="disabled">

    <!-- Trigger: shows the selected value when closed, becomes a search input when open -->
    <div class="dropdown-trigger" (click)="!isOpen && toggleDropdown()">

        @if (!isOpen) {
        <span class="trigger-text" [class.is-placeholder]="!selectedValue">
            {{ selectedValue ? selectedLabel : placeholder }}
        </span>
        } @else {
        <input #searchInput type="text" class="trigger-search" [placeholder]="selectedLabel || searchPlaceholder"
            [value]="searchTerm" (input)="onSearchChange($any($event.target).value)" (keydown)="onKeyDown($event)"
            (click)="$event.stopPropagation()" autocomplete="off">
        }

        <button type="button" class="chevron-btn" (click)="onChevronClick($event)" [disabled]="disabled"
            [attr.aria-expanded]="isOpen" aria-haspopup="listbox" tabindex="-1">
            <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
                fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>

    <!-- Dropdown panel: just the options now, no separate search box -->
    @if (isOpen) {
    <div class="dropdown-panel" role="listbox">
        <div class="options-list" [style.max-height.px]="maxVisibleItems * 38">

            @if (filteredOptions.length === 0) {
            <div class="no-results">No results found</div>
            }

            @for (option of filteredOptions; track option.value; let i = $index) {
            <div class="dropdown-option" [class.selected]="option.value === selectedValue"
                [class.highlighted]="i === highlightedIndex" (click)="selectOption(option)"
                (mouseenter)="setHighlight(i)" role="option" [attr.aria-selected]="option.value === selectedValue">

                <span class="option-label">{{ option.label }}</span>

                @if (option.value === selectedValue) {
                <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor"
                    stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                }
            </div>
            }
        </div>
    </div>
    }
</div>
